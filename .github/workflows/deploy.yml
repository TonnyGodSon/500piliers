name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Nom de domaine personnalisé (facultatif) : variable de dépôt CUSTOM_DOMAIN
      # (Settings → Secrets and variables → Actions → Variables), ex. « 500piliers.fr ».
      # - Sans domaine : site servi sous https://<utilisateur>.github.io/<dépôt>/ (préfixe /<dépôt>)
      # - Avec domaine : site servi à la racine https://<domaine>/ (aucun préfixe)
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      NEXT_PUBLIC_BASE_PATH: ${{ vars.CUSTOM_DOMAIN == '' && format('/{0}', github.event.repository.name) || '' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.CUSTOM_DOMAIN != '' && format('https://{0}', vars.CUSTOM_DOMAIN) || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions »
      # (le jeton automatique des workflows n'a pas le droit d'activer Pages lui-même)
      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Installation des dépendances
        run: npm ci

      - name: Build du site statique
        run: |
          echo "Préfixe : '${NEXT_PUBLIC_BASE_PATH}' – URL : ${NEXT_PUBLIC_SITE_URL}"
          npm run build

      - name: Fichier CNAME (nom de domaine personnalisé)
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "$CUSTOM_DOMAIN" > out/CNAME

      - name: Envoi du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Mise en ligne
        id: deployment
        uses: actions/deploy-pages@v4

