name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build du site statique (version autonome, hébergeable à la racine d'un domaine)
        run: |
          npm ci
          npm run build
          cd out && zip -qr "../500piliers-site-${GITHUB_REF_NAME}.zip" .

      - name: Notes de version (depuis CHANGELOG.md)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f=1; next }
            /^## \[/ && f { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md
          echo "" >> release-notes.md
          echo "🌐 Site en ligne : https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> release-notes.md

      - name: Création de la Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: 500piliers-site-${{ github.ref_name }}.zip

