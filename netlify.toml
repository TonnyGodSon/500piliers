# Configuration Netlify (alternative à GitHub Pages, compatible dépôt privé)
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # À adapter avec votre nom de domaine (sitemap, aperçus sur les réseaux sociaux)
  NEXT_PUBLIC_SITE_URL = "https://500piliers.fr"

# Mise en cache longue des fichiers statiques versionnés
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

